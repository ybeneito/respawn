<div class="levelup-overlay">
  <div class="rays"></div>
  <app-cat-sprite [palette]="profile().palette" [stage]="stage()" [pixelSize]="14" />
  <div class="banner pf">{{ 'levelUp.title' | transloco }}</div>
  <div class="level-number pf">{{ newLevel() }}</div>
  <button class="pbtn amber" (click)="continued.emit()">{{ 'levelUp.continue' | transloco }}</button>
</div>
