@if (!isLoggedIn()) {
  <router-outlet />
} @else {
  <div class="shell scanlines vignette">
    <nav class="left-rail" aria-label="Main navigation">
      <div class="logo">
        <img src="/respawn-mark.svg" alt="Respawn" class="logo-mark">
      </div>
      <ul class="nav-links">
        <li><a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item pf">{{ 'nav.dashboard' | transloco }}</a></li>
        <li><a routerLink="/quests" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item pf">{{ 'nav.quests' | transloco }}</a></li>
      </ul>
      <div class="bottom-actions">
        <app-lang-switcher />
        <button class="pbtn ghost sm signout-btn" (click)="signOut()">{{ 'nav.signOut' | transloco }}</button>
      </div>
    </nav>

    <main class="main-area">
      <router-outlet />
    </main>

    <aside class="right-rail">
      <app-companion-rail />
    </aside>
  </div>
}
