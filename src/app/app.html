@if (!isLoggedIn()) {
  <router-outlet />
} @else {
  <div class="shell scanlines vignette">
    <nav class="left-rail" aria-label="Main navigation">
      <div class="logo">
        <h1 class="pf logo-title">RESPAWN</h1>
        <span class="sk tagline">9 LIVES · ONE DAY AT A TIME</span>
      </div>
      <ul class="nav-links">
        <li><a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item pf">DASHBOARD</a></li>
        <li><a routerLink="/quests" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item pf">QUESTS</a></li>
      </ul>
      <button class="pbtn ghost sm signout-btn" (click)="signOut()">SIGN OUT</button>
    </nav>

    <main class="main-area">
      <router-outlet />
    </main>

    <aside class="right-rail">
      <app-companion-rail />
    </aside>
  </div>
}
